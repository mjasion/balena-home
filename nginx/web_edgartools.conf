# EdgarTools MCP server (SEC EDGAR filings) for claude.ai / Claude Code
# Accessible via: https://edgar.mjasion.dev/mcp
# Requires a Cloudflare tunnel public hostname routed to nginx AND a Cloudflare Access
# self-hosted application on that hostname with Managed OAuth on — edgartools itself
# has no authentication.

server {
    listen 80;
    server_name edgar.mjasion.dev;

    # Docker embedded DNS: resolve at request time so nginx starts even when edgartools is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $edgartools http://edgartools:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /mcp {
        # Cloudflare Access adds this header to every request it lets through
        if ($http_cf_access_jwt_assertion = "") {
            return 403;
        }

        proxy_pass $edgartools;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;

        # Some tools fetch and parse whole filings from SEC
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        return 404;
    }
}
