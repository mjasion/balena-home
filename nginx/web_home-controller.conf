# gocron scheduler UI
# Accessible via: https://home-controller.mjasion.dev
# Requires Cloudflare tunnel configuration to route traffic to nginx

server {
    listen 80;
    server_name home-controller.mjasion.dev;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to gocron UI running on home-controller:8080
    # home-controller uses network_mode: host
    location / {
        proxy_pass http://192.168.211.12:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # Disable buffering for real-time updates
        proxy_buffering off;
    }
}
