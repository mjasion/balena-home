name: Balena Build Test

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: balena-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    # BALENA_API_TOKEN is not available to Dependabot or fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Create .env file
      run: |
        cat > .env << EOF
        TUNNEL_TOKEN=test-token-placeholder
        EOF

    - name: Test Balena Build
      uses: balena-io/deploy-to-balena-action@3653c472f0bb6a9885110328b28c3a80470b3b63 # master
      with:
        balena_token: ${{ secrets.BALENA_API_TOKEN }}
        fleet: ${{ secrets.BALENA_APP_NAME }}
        create_ref: false

