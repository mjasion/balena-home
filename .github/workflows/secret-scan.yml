name: Secret Scanning

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Run weekly on Fridays at 10 AM UTC
    - cron: '0 10 * * 5'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # main
        with:
          path: ./
          extra_args: --only-verified

  summary:
    name: Scan Summary
    runs-on: ubuntu-latest
    needs: [trufflehog]
    if: always()
    steps:
      - name: Check scan results
        run: |
          echo "Secret scanning completed"
          echo "TruffleHog: ${{ needs.trufflehog.result }}"
          echo "Trivy: ${{ needs.trivy-secret-scan.result }}"

          if [[ "${{ needs.trufflehog.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy-secret-scan.result }}" == "failure" ]]; then
            echo "⚠️ Secret scanning detected issues"
            exit 1
          fi

          echo "✅ All secret scans passed"
