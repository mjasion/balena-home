name: BalenaCloud Deploy
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 9 1 * *'
  workflow_dispatch:

concurrency:
  group: balena-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Create .env file
      run: |
        cat > .env << EOF
        TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}
        EOF

    - name: Deploy to BalenaCloud
      uses: balena-io/deploy-to-balena-action@3653c472f0bb6a9885110328b28c3a80470b3b63 # master
      id: build
      with:
        balena_token: ${{ secrets.BALENA_API_TOKEN }}
        fleet: ${{ secrets.BALENA_APP_NAME }}

    - name: Log release ID
      run: echo "Built release ID ${{ steps.build.outputs.release_id }}"

