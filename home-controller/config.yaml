# BLE Temperature Monitoring Configuration

# BLE scanning configuration
ble:
  # List of sensors to monitor
  # Note: BLE scanning runs continuously; sensors broadcast every 2-5 seconds
  sensors:
    - name: Sypialnia
      id: 1
      macAddress: A4:C1:38:ED:C0:21
    - name: Salon
      id: 2
      macAddress: A4:C1:38:26:E2:4C
    - name: Łazienka
      id: 3
      macAddress: A4:C1:38:F1:2D:0D
    - name: Balkon
      id: 4
      macAddress: A4:C1:38:3E:5F:D1

# Netatmo API credentials
# Note: Netatmo polling is now handled by the thermostat controller
# No separate polling schedule needed - controller manages API calls
netatmo:
  # Netatmo OAuth2 credentials
  # Get these from https://dev.netatmo.com/apps
  # IMPORTANT: Use environment variables for sensitive data
  clientId: ""  # or use NETATMO_CLIENT_ID env var
  clientSecret: ""  # or use NETATMO_CLIENT_SECRET env var
  refreshToken: ""  # or use NETATMO_REFRESH_TOKEN env var

# Power meter monitoring
power:
  # Enable power meter monitoring
  enabled: true

  # HTTP endpoint URL for power meter scraping
  # Example: http://192.168.1.100/metrics or http://powermeter.local/status
  scrapeUrl: "http://192.168.25.46/state"  # or use POWER_SCRAPE_URL env var

  # HTTP request timeout in seconds (default: 1.5)
  scrapeTimeoutSeconds: 0.99

  # Cron syntax for scheduling (REQUIRED)
  # 6-field cron with seconds: second minute hour day month weekday
  # Examples:
  #   "* * * * * *"      - Every second
  #   "*/5 * * * * *"    - Every 5 seconds
  #   "0 * * * * *"      - Every minute at second 0
  #   "0 */5 * * * *"    - Every 5 minutes at second 0
  cron: "* * * * * *"  # Every second (or use POWER_CRON env var)

# Pyroscope profiling configuration
pyroscope:
  # Enable Pyroscope continuous profiling
  enabled: true

  # Pyroscope server URL
  # For Grafana Cloud: https://profiles-prod-XXX.grafana.net
  # For local: http://pyroscope-server:4040
  serverUrl: "https://profiles-prod-003.grafana.net"  # or use PYROSCOPE_SERVER_URL env var

  # Application name for profiling data
  # This will appear in Pyroscope UI for filtering
  applicationName: "home-controller"  # or use PYROSCOPE_APPLICATION_NAME env var

  # Basic auth username (for Grafana Cloud, this is your instance ID)
  basicAuthUser: "192047"  # or use PYROSCOPE_BASIC_AUTH_USER env var

  # Basic auth password (for Grafana Cloud, this is your API key)
  # IMPORTANT: Use PYROSCOPE_BASIC_AUTH_PASSWORD environment variable
  basicAuthPassword: ""  # or use PYROSCOPE_BASIC_AUTH_PASSWORD env var

  # Profile types to enable (all enabled by default)
  # Supported: cpu, alloc_objects, alloc_space, inuse_objects, inuse_space,
  #            goroutines, mutex, block
  profileTypes:
    - cpu              # CPU profiling
    - alloc_objects    # Memory allocation object count
    - alloc_space      # Memory allocation bytes
    - inuse_objects    # In-use memory object count
    - inuse_space      # In-use memory bytes
    - goroutines       # Number of goroutines

  # Mutex profiling rate (0 = disabled, recommended: 5-10 for production)
  # Higher = more detail but more overhead
  mutexProfileRate: 10

  # Block profiling rate (0 = disabled, recommended: 1000000-10000000 nanoseconds)
  # Samples blocking events that last longer than this duration
  blockProfileRate: 10000000

  # Disable GC runs for more efficient memory profiling
  # Set to true if tracking many objects (reduces CPU overhead, less precise heap profiles)
  disableGCRuns: false

  # Additional tags for filtering in Pyroscope UI
  # Example: environment, version, hostname
  tags: {}

# OpenTelemetry tracing configuration
opentelemetry:
  # Enable OpenTelemetry tracing
  enabled: true

  # OTLP endpoint URL for traces
  # For Grafana Cloud: https://otlp-gateway-prod-XX-YY.grafana.net/otlp
  # For local: http://localhost:4318
  endpoint: "https://otlp-gateway-prod-us-central-0.grafana.net/otlp"  # or use OTEL_EXPORTER_OTLP_ENDPOINT env var

  # OTLP protocol: "grpc", "http/protobuf", or "http/json"
  # For Grafana Cloud: use "http/protobuf"
  protocol: "http/protobuf"  # or use OTEL_EXPORTER_OTLP_PROTOCOL env var

  # OTLP headers for authentication
  # Format: "key1=value1,key2=value2"
  # For Grafana Cloud with basic auth: "Authorization=Basic <base64_credentials>"
  # IMPORTANT: Use OTEL_EXPORTER_OTLP_HEADERS environment variable for sensitive data
  headers: ""  # or use OTEL_EXPORTER_OTLP_HEADERS env var

  # Service name for tracing
  # This will appear in Grafana Tempo for filtering
  serviceName: "home-controller"  # or use OTEL_SERVICE_NAME env var

  # Global sampling rate (0.0-1.0) for most operations
  # 1.0 = send all traces, 0.1 = send 10% of traces
  samplingRate: 1.0  # or use OTEL_SAMPLING_RATE env var

  # Metrics sampling rate (0.0-1.0) for metrics push operations
  # Set lower than samplingRate to reduce high-frequency trace volume
  # This applies to all spans starting with "metrics."
  metricsSamplingRate: 0.25  # or use OTEL_METRICS_SAMPLING_RATE env var

  # Additional resource attributes
  # Example: environment, version, hostname
  resourceAttributes: {}

# Prometheus metrics push configuration
prometheus:
  # Interval between metric pushes in seconds (minimum: 1)
  # When cron is not set, uses random duration: pushIntervalSeconds ± 1 second
  # This prevents thundering herd when multiple instances are running
  # Example: If set to 10, actual interval will be randomly between 9-11 seconds
  pushIntervalSeconds: 10

  # Prometheus remote_write endpoint URL
  # For Grafana Cloud, use: https://prometheus-prod-XX-YY-ZZ.grafana.net/api/prom/push
  prometheusUrl: "https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push"

  # Prometheus basic auth username (Grafana Cloud instance ID)
  prometheusUsername: "83165"

  # Grafana Cloud password (API key)
  # IMPORTANT: Use PROMETHEUS_PASSWORD environment variable instead of storing here
  prometheusPassword: ""

  # Start pushing at even second boundaries (improves alignment in time series)
  # Note: This setting is deprecated and has no effect when using random duration
  startAtEvenSecond: true

  # Ring buffer size (number of readings to buffer before push)
  bufferSize: 200000

  # Batch size for pushing metrics (number of readings per batch, default: 1000)
  # Larger batches are more efficient but may hit size limits on the receiving end
  batchSize: 1000

  # Cron syntax for scheduling (OPTIONAL - leave empty to use random duration)
  # 6-field cron with seconds: second minute hour day month weekday
  # Examples:
  #   "*/10 * * * * *"   - Every 10 seconds
  #   "*/30 * * * * *"   - Every 30 seconds
  #   "0 * * * * *"      - Every minute at second 0
  # Note: When empty, uses random duration based on pushIntervalSeconds
  cron: ""  # or use PROMETHEUS_CRON env var

# Logging configuration
logging:
  # Log format: "console" (human-readable) or "json" (structured)
  # Use "console" for development, "json" for production
  logFormat: "console"

  # Log level: "debug", "info", "warn", "error"
  logLevel: "info"

# BLE Sensor Aggregator
# Calculates weighted average temperatures for all sensors
aggregator:
  # Enable BLE aggregator (default: true)
  # When enabled, calculates time-weighted averages over 60 seconds
  enabled: true

  # Cron syntax for scheduling (REQUIRED)
  # 6-field cron with seconds: second minute hour day month weekday
  # Note: Each calculation looks back 60 seconds
  # Examples:
  #   "*/30 * * * * *"   - Every 30 seconds
  #   "0 * * * * *"      - Every minute at second 0
  #   "0 */5 * * * *"    - Every 5 minutes at second 0
  cron: "0 * * * * *"  # Every minute at second 0 (or use AGGREGATOR_CRON env var)

# Intelligent Thermostat Control (NEW)
# IMPORTANT: This feature is DISABLED by default. Enable only after reviewing all settings.
thermostatControl:
  # Enable thermostat control (default: false - feature disabled)
  # IMPORTANT: Requires Netatmo OAuth2 token with read_thermostat and write_thermostat scopes
  enabled: true

  # Dry-run mode: Log control decisions without sending commands to thermostats (default: false)
  # Use this for testing before enabling real control
  # When true: Control loop runs, decisions are logged, but no API calls are made
  dryRun: true

  # Temperature difference threshold (°C) to trigger adjustment (default: 0.5)
  # Minimum difference between Xiaomi sensor and scheduled temperature to trigger action
  # Range: 0.1 to 5.0°C (lower = more aggressive, higher = more relaxed)
  temperatureThreshold: 0.2

  # Cron syntax for scheduling (REQUIRED)
  # 6-field cron with seconds: second minute hour day month weekday
  # Examples:
  #   "0 * * * * *"      - Every minute at second 0
  #   "0 */2 * * * *"    - Every 2 minutes at second 0
  #   "0 */3 * * * *"    - Every 3 minutes at second 0
  #   "0 */5 * * * *"    - Every 5 minutes at second 0
  #   "0 */15 * * * *"   - Every 15 minutes at second 0
  #   "0 0 6-22 * * *"   - Every hour from 6 AM to 10 PM

  # Home status fetch cron (fetches Netatmo API data and caches it)
  # Runs shortly before control loop to ensure fresh data
  homeStatusFetchCron: "0 * * * * *"  # Every at second 0 (or use HOME_STATUS_FETCH_CRON env var)

  # Control loop cron (evaluates control decisions using cached data)
  # Runs 30 seconds after home status fetch to use fresh data
  controlLoopCron: "30 */3 * * * *"  # Every 3 minutes at second 30 (or use CONTROL_LOOP_CRON env var)

  # Schedule sync interval in minutes (default: 15, set to 0 to disable)
  # Syncs actual schedule temperature by temporarily switching to schedule mode
  # This solves the problem where Netatmo API doesn't expose schedule when in manual mode
  # How it works (HYBRID APPROACH):
  #   1. Switch thermostat to schedule mode
  #   2. Read current setpoint (reflects actual schedule)
  #   3. Compare with previous synced temperature:
  #      - If UNCHANGED: Restore previous override immediately (no re-evaluation)
  #      - If CHANGED: Skip restore, bypass delayed execution, re-evaluate immediately
  #   4. Continue normal control loop
  # Benefits:
  #   - Minimal interruption when schedule unchanged (< 2 seconds)
  #   - Immediate response when schedule changes (bypasses delayed execution)
  #   - No extra API calls for unchanged schedules
  # IMPORTANT: Runs BEFORE control decisions to ensure fresh schedule data
  scheduleSyncIntervalMinutes: 15  # Recommended: 15 minutes for responsive schedule tracking

  # Poll interval after switching to schedule mode (default: 2 seconds)
  # How long to wait between API calls when checking if mode has switched
  scheduleSyncPollIntervalSeconds: 2  # or use SCHEDULE_SYNC_POLL_INTERVAL env var

  # Poll timeout for schedule mode confirmation (default: 30 seconds)
  # Maximum time to wait for thermostat to confirm it's in schedule mode
  # If timeout occurs, schedule sync fails and control loop uses fallback logic
  scheduleSyncPollTimeoutSeconds: 30  # or use SCHEDULE_SYNC_POLL_TIMEOUT env var

  # Override duration in minutes (default: 10)
  # SAFETY: All setpoint changes auto-expire after this duration (fail-safe)
  # After expiration, thermostat reverts to schedule mode
  # System will automatically extend the override if temperature still requires control
  overrideDurationMinutes: 15

  # Extension threshold in minutes (default: 2)
  # When override has less than this time remaining, extend it automatically
  # This prevents the thermostat from briefly switching back to schedule mode
  # Must be less than overrideDurationMinutes
  extensionThresholdMinutes: 4  # Restored to original value

  # External modification behavior:
  # If thermostat is manually changed, automation pauses INDEFINITELY
  # Automation resumes ONLY when thermostat is switched back to "schedule" mode
  # This respects your manual temperature adjustments without time limits
  # externalModificationResetMinutes: 5  # (Currently unused - kept for potential future timeout feature)

  # Safety limits for calculated setpoints
  # SAFETY: Setpoints are clamped to these limits to prevent extreme temperatures
  minSetpointCelsius: 10.0  # Minimum setpoint (prevents freezing)
  maxSetpointCelsius: 30.0  # Maximum setpoint (prevents overheating)

  # Sensor-to-room mappings
  # Associates Netatmo rooms with Xiaomi BLE sensors
  # One sensor can be shared by multiple rooms
  mappings:
  # Example configuration (uncomment and customize):
  # - roomName: "Sypialnia"  # Must match Netatmo room name exactly
  #   sensorMAC: "A4:C1:38:ED:C0:21"  # Xiaomi sensor MAC (must exist in ble.sensors)
  #   roomID: ""  # Leave empty - auto-populated at startup from Netatmo API
  #
   - roomName: "Salon"
     sensorMAC: "A4:C1:38:26:E2:4C"
   - roomName: "Hol"
     sensorMAC: "A4:C1:38:26:E2:4C"
   - roomName: "Sypialnia"
     sensorMAC: "A4:C1:38:ED:C0:21"
   - roomName: "Łazienka"
     sensorMAC: "A4:C1:38:F1:2D:0D"

  # Hard override schedules (optional)
  # Time-based temperature overrides that take precedence over normal control
  # Use for predictable patterns (e.g., warm up bedroom before waking)
  hardOverrides:
    # Example configuration (uncomment and customize):
    # - roomName: "Sypialnia"
    #   schedule:
    #     - startTime: "22:00"  # HH:MM format (24-hour)
    #       endTime: "07:00"    # Can span midnight
    #       targetTemperature: 19.0
    #       days: ["Mon", "Tue", "Wed", "Thu", "Fri"]  # Optional: specify days of week
    #     - startTime: "06:30"  # Multiple windows allowed
    #       endTime: "08:00"
    #       targetTemperature: 22.0
    #       days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
    #     - startTime: "23:00"  # Weekend schedule
    #       endTime: "09:00"
    #       targetTemperature: 18.5
    #       days: ["Sat", "Sun"]  # Only on weekends
    # - roomName: "Salon"
    #   schedule:
    #     - startTime: "08:00"
    #       endTime: "10:00"
    #       targetTemperature: 22.0
    #       # No days specified = applies every day
   - roomName: "Łazienka"
     schedule:
       - startTime: "06:10"
         endTime: "06:30"
         targetTemperature: 26.5
         days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
   - roomName: "Hol"
     schedule:
       - startTime: "06:10"
         endTime: "06:30"
         targetTemperature: 24.0
         days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
   - roomName: "Sypialnia"
     schedule:
       - startTime: "06:10"
         endTime: "07:30"
         targetTemperature: 23.0
         days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
   - roomName: "Sypialnia"
     schedule:
       - startTime: "00:00"
         endTime: "05:00"
         targetTemperature: 23.0
         days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]

# Job Scheduler Configuration
scheduler:
  # Enable web UI for viewing and managing scheduled jobs
  uiEnabled: true

  # Host address for the scheduler UI server (0.0.0.0 = all interfaces)
  # For local access only, use "127.0.0.1" or "localhost"
  uiHost: "0.0.0.0"  # or use SCHEDULER_UI_HOST env var

  # Port for the scheduler UI server
  uiPort: 8080  # or use SCHEDULER_UI_PORT env var

  # Access the UI at: http://<host>:8080

# USAGE NOTES:
#
# 1. BEFORE ENABLING:
#    - Verify Netatmo OAuth2 token has write_thermostat scope
#    - Test with dryRun: true first
#    - Monitor logs for "DRY-RUN" messages
#    - Verify room names match Netatmo exactly
#    - Verify sensor MACs exist in ble.sensors
#
# 2. CONTROL ALGORITHM:
#    - Reads Xiaomi BLE sensor (weighted average of last 60 seconds)
#    - Compares with scheduled temperature (from Netatmo or hard override)
#    - If |xiaomiTemp - scheduledTemp| > threshold:
#      - Calculates: newSetpoint = thermostatMeasured + (xiaomiTemp - scheduledTemp)
#      - Clamps to safety limits (10-30°C)
#      - Sends temporary override to Netatmo (default: 30 minutes)
#    - Automatically extends override before it expires (prevents mode switching)
#    - Evaluates every controlIntervalSeconds (default: 60s)
#
# 3. PRECEDENCE HIERARCHY:
#    1. External modification detected → Pause control for 24h or until schedule mode
#    2. Hard override active → Use hard override temperature as target
#    3. Normal control → Use Netatmo schedule temperature as target
#
# 4. MONITORING:
#    - Check Grafana metrics: thermostat_control_*
#    - Alert if thermostat_control_temperature_difference_celsius > 1.0°C
#    - Alert if thermostat_control_action == 0 (skip) for > 1 hour
#    - Dashboard: Xiaomi temp vs Netatmo measured (should converge)
#
# 5. TROUBLESHOOTING:
#    - "sensor data unavailable" → Check BLE sensor broadcasting
#    - "room not found" → Verify room name matches Netatmo
#    - "externally modified" → Switch thermostat to schedule mode to resume automation
#    - "(extending, Xm left)" in logs → Normal behavior, extending existing override
