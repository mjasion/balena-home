# Balena Secrets Configuration (Example)
# Copy this file to secrets.yaml and fill in your actual values
# IMPORTANT: Never commit secrets.yaml to git!
#
# Usage:
#   ./scripts/sync-balena-secrets.sh <fleet-or-device> secrets.yaml
#   ./scripts/sync-balena-secrets.sh <fleet-or-device> secrets.yaml --env production
#
# Variable naming in Balena:
#   - Shared: VARIABLE_NAME
#   - Service-specific: SERVICE_NAME_VARIABLE_NAME (e.g., home-controller_NETATMO_CLIENT_ID)

# =============================================================================
# SHARED SECRETS (applied to all services without prefix)
# =============================================================================
shared:
  # Grafana Cloud (shared across multiple services)
  GRAFANA_CLOUD_INSTANCE_ID: "REPLACE_WITH_YOUR_INSTANCE_ID"
  GRAFANA_CLOUD_API_KEY: "REPLACE_WITH_YOUR_API_KEY"
  GRAFANA_CLOUD_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-central-0.grafana.net/otlp"

  # Prometheus (used by home-controller and potentially others)
  PROMETHEUS_URL: "https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push"
  PROMETHEUS_USERNAME: "REPLACE_WITH_YOUR_PROMETHEUS_USERNAME"
  PROMETHEUS_PASSWORD: "REPLACE_WITH_YOUR_PROMETHEUS_PASSWORD"

  # Logging defaults
  LOG_FORMAT: "logfmt"
  LOG_LEVEL: "info"

# =============================================================================
# SERVICE-SPECIFIC SECRETS (prefixed with service name in Balena)
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # home-controller: Climate monitoring and automation service
  # ---------------------------------------------------------------------------
  home-controller:
    # Netatmo API credentials
    NETATMO_CLIENT_ID: "REPLACE_WITH_YOUR_NETATMO_CLIENT_ID"
    NETATMO_CLIENT_SECRET: "REPLACE_WITH_YOUR_NETATMO_CLIENT_SECRET"
    NETATMO_REFRESH_TOKEN: "REPLACE_WITH_YOUR_NETATMO_REFRESH_TOKEN"

    # Thermostat Control settings
    THERMOSTAT_CONTROL_ENABLED: "true"
    THERMOSTAT_CONTROL_DRY_RUN: "false"  # Set to "true" for testing without actual thermostat changes
    TEMPERATURE_THRESHOLD: "0.2"
    OVERRIDE_DURATION_MINUTES: "10"

    # Thermostat Control Kill Switches (emergency disable)
    METRIC_JOB_ENABLED: "true"
    CONTROL_JOB_ENABLED: "true"
    HARD_OVERRIDE_JOB_ENABLED: "true"

    # Power Monitoring
    POWER_ENABLED: "true"
    POWER_SCRAPE_URL: "http://192.168.25.46/state"  # Update with your power meter IP
    POWER_SCRAPE_TIMEOUT: "0.99"
    POWER_CRON: "* * * * * *"  # Every second

    # Pyroscope Profiling (optional)
    PYROSCOPE_ENABLED: "true"
    PYROSCOPE_SERVER_URL: "https://profiles-prod-003.grafana.net"
    PYROSCOPE_APPLICATION_NAME: "home-controller"
    PYROSCOPE_BASIC_AUTH_USER: "REPLACE_WITH_YOUR_GRAFANA_INSTANCE_ID"
    PYROSCOPE_BASIC_AUTH_PASSWORD: "REPLACE_WITH_YOUR_GRAFANA_API_KEY"

    # OpenTelemetry Tracing
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
    OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    OTEL_SERVICE_NAME: "home-controller"
    OTEL_SAMPLING_RATE: "1.0"
    OTEL_METRICS_SAMPLING_RATE: "0.25"

    # Scheduler UI
    SCHEDULER_UI_ENABLED: "true"
    SCHEDULER_UI_HOST: "0.0.0.0"
    SCHEDULER_UI_PORT: "8080"

    # BLE Aggregator
    AGGREGATOR_ENABLED: "true"
    AGGREGATOR_CRON: "0 * * * * *"  # Every minute

  # ---------------------------------------------------------------------------
  # alloy: Grafana Alloy observability agent
  # ---------------------------------------------------------------------------
  alloy:
    # Alloy uses shared GRAFANA_CLOUD_* credentials automatically
    # Add any alloy-specific overrides here if needed
    pass: true

  # ---------------------------------------------------------------------------
  # datadog: Datadog Agent
  # ---------------------------------------------------------------------------
  datadog:
    DD_API_KEY: "REPLACE_WITH_YOUR_DATADOG_API_KEY"
    DD_SITE: "datadoghq.com"
    DD_LOGS_ENABLED: "true"
    DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
    DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    DD_AC_EXCLUDE: "name:datadog-agent"
    DD_APM_ENABLED: "true"
    DD_APM_NON_LOCAL_TRAFFIC: "true"
    DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:4317"
    DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:4318"
    DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"

  # ---------------------------------------------------------------------------
  # tunnel: Cloudflare Tunnel
  # ---------------------------------------------------------------------------
  tunnel:
    TUNNEL_TOKEN: "REPLACE_WITH_YOUR_CLOUDFLARE_TUNNEL_TOKEN"

  # ---------------------------------------------------------------------------
  # wolweb: Wake-on-LAN web interface
  # ---------------------------------------------------------------------------
  wolweb:
    WOLWEBHOST: "0.0.0.0"
    WOLWEBPORT: "8089"
    WOLWEBBCASTIP: "192.168.1.255:9"  # Update with your broadcast IP

  # ---------------------------------------------------------------------------
  # nginx: Reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    # Add nginx-specific env vars if needed
    pass: true

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES (optional)
# Use with --env flag to override values per environment
# =============================================================================
environments:
  # Development environment
  development:
    shared:
      LOG_LEVEL: "debug"
      PROMETHEUS_URL: "http://localhost:9090/api/v1/write"  # Local Prometheus for testing

    services:
      home-controller:
        THERMOSTAT_CONTROL_ENABLED: "true"
        THERMOSTAT_CONTROL_DRY_RUN: "true"  # Always dry-run in dev
        PYROSCOPE_ENABLED: "false"  # Disable profiling in dev
        OTEL_ENABLED: "false"  # Disable tracing in dev
        POWER_ENABLED: "false"  # Disable power monitoring in dev

  # Production environment
  production:
    shared:
      LOG_LEVEL: "info"

    services:
      home-controller:
        THERMOSTAT_CONTROL_ENABLED: "true"
        THERMOSTAT_CONTROL_DRY_RUN: "false"  # Real control in production
        PYROSCOPE_ENABLED: "true"
        OTEL_ENABLED: "true"
        POWER_ENABLED: "true"

  # Staging environment
  staging:
    shared:
      LOG_LEVEL: "debug"

    services:
      home-controller:
        THERMOSTAT_CONTROL_ENABLED: "true"
        THERMOSTAT_CONTROL_DRY_RUN: "true"  # Dry-run in staging for safety
