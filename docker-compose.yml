version: "2.1"

services:
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  nginx:
    build: nginx
    ports:
      - "80:80"
      - "443:443"
  wolweb:
    build: wolweb
    network_mode: host

    # Use environment variable below to change port or virtual directory.
    environment:
      WOLWEBHOST: "0.0.0.0"
      WOLWEBPORT: "8089"
      #WOLWEBVDIR: "/wolweb"
      WOLWEBBCASTIP: "192.168.1.255:9"
#  scanner:
#    build: scanner
#    network_mode: host
#    privileged: true
#    environment:
#      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
#    labels:
#      io.balena.features.dbus: '1'
  home-controller:
    build: home-controller
    network_mode: host
    privileged: true
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
    labels:
      io.balena.features.dbus: '1'
      com.datadoghq.ad.logs: '[{"source": "home-controller", "service": "home-controller"}]'
      com.datadoghq.ad.tags: '["env:production", "service:home-automation"]'
  alloy:
    build: alloy
    container_name: grafana-alloy
    restart: unless-stopped
    network_mode: host
    environment:
      # Grafana Cloud - unified credentials
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID}
      # OTLP
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT}
      # Loki (logs)
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USERNAME=${GRAFANA_CLOUD_LOKI_USERNAME}
    labels:
      io.balena.features.balena-socket: '1'
  datadog-agent:
    build: datadog
    container_name: datadog-agent
    restart: unless-stopped
    hostname: balena-home
    privileged: true
    pid: host
    network_mode: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_HOSTNAME=balena-home3
      # Docker Integration
      - DOCKER_HOST=unix:///var/run/balena-engine.sock
      # Logs
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
      - DD_AC_EXCLUDE="name:datadog-agent"
      - DD_LOGS_CONFIG_DOCKER_LABELS_AS_TAGS='{"com.datadoghq.tags.service":"service","com.datadoghq.tags.env":"env","io.balena.service.name":"balena_service"}'
      # APM / Traces
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT=0.0.0.0:14317
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT=0.0.0.0:14318
      # DogStatsD
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      # Docker metrics
      - DD_DOCKER_LABELS_AS_TAGS='{"com.datadoghq.tags.service":"service","com.datadoghq.tags.env":"env","io.balena.service.name":"balena_service"}'
      # Completely disable process-agent (doesn't work without /proc mount on Balena)
      - DD_PROCESS_AGENT_ENABLED=false
      - DD_SYSTEM_PROBE_ENABLED=false
    labels:
      io.balena.features.balena-socket: '1'

