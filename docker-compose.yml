version: "2.1"

services:
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:2026.1.1
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  nginx:
    build: nginx
    ports:
      - "80:80"
      - "443:443"
  wolweb:
    build: wolweb
    network_mode: host

    # Use environment variable below to change port or virtual directory.
    environment:
      WOLWEBHOST: "0.0.0.0"
      WOLWEBPORT: "8089"
      #WOLWEBVDIR: "/wolweb"
      WOLWEBBCASTIP: "192.168.1.255:9"
#  scanner:
#    build: scanner
#    network_mode: host
#    privileged: true
#    environment:
#      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
#    labels:
#      io.balena.features.dbus: '1'
  home-controller:
    build: home-controller
    network_mode: host
    privileged: true
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
    labels:
      io.balena.features.dbus: '1'
      com.datadoghq.ad.logs: '[{"source": "home-controller", "service": "home-controller"}]'
      com.datadoghq.ad.tags: '["env:production", "service:home-automation"]'
  alloy:
    build: alloy
    container_name: grafana-alloy
    restart: unless-stopped
    network_mode: host
    environment:
      # Grafana Cloud - unified credentials
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID}
      # OTLP
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT}
      # Loki (logs)
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USERNAME=${GRAFANA_CLOUD_LOKI_USERNAME}
    labels:
      io.balena.features.balena-socket: '1'
  datadog-agent:
    build: datadog
    container_name: datadog-agent
    restart: unless-stopped
    hostname: balena-home
    privileged: true
    pid: host
    network_mode: host
    environment:
      # Secrets and deployment-specific configuration
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_HOSTNAME=balena-home
    labels:
      io.balena.features.balena-socket: '1'
      # This effectively does "--pid=host", mounting host /proc over container /proc
      io.balena.features.procfs: '1'
      # Mounts host /sys over container /sys
      io.balena.features.sysfs: '1'
      # Mounts host /var/lib/docker/volumes to allow disk usage checks (optional)
      io.balena.features.supervisor-api: '1'

      io.balena.features.kernel-modules: '1'
      io.balena.features.firmware: '1'
      io.balena.features.dbus: '1'
      io.balena.features.journal-logs: '1'
      io.balena.features.balena-api: '1'
