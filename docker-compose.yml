version: "2.1"

services:
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:2026.7.1
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  nginx:
    build: nginx
    ports:
      - "80:80"
      - "443:443"
  wolweb:
    build: wolweb
    network_mode: host

    # Use environment variable below to change port or virtual directory.
    environment:
      WOLWEBHOST: "0.0.0.0"
      WOLWEBPORT: "8089"
      #WOLWEBVDIR: "/wolweb"
      WOLWEBBCASTIP: "192.168.1.255:9"
#  scanner:
#    build: scanner
#    network_mode: host
#    privileged: true
#    environment:
#      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
#    labels:
#      io.balena.features.dbus: '1'
  home-controller:
    build: home-controller
    network_mode: host
    privileged: true
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
    labels:
      io.balena.features.dbus: '1'
  alloy:
    build: alloy
    container_name: grafana-alloy
    restart: unless-stopped
    network_mode: host
    environment:
      # Grafana Cloud - unified credentials
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID}
      # OTLP
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT}
      # Loki (logs)
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USERNAME=${GRAFANA_CLOUD_LOKI_USERNAME}
      # New Relic
      - NEW_RELIC_OTLP_ENDPOINT=${NEW_RELIC_OTLP_ENDPOINT}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      # Honeycomb
      - HONEYCOMB_OTLP_ENDPOINT=${HONEYCOMB_OTLP_ENDPOINT}
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY}
      # Better Stack
      - BETTER_STACK_OTLP_ENDPOINT=${BETTER_STACK_OTLP_ENDPOINT}
      - BETTER_STACK_AUTH_HEADER=${BETTER_STACK_AUTH_HEADER}
    labels:
      io.balena.features.balena-socket: '1'
