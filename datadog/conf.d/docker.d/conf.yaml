## Docker Integration Configuration for Datadog
## This enables Docker monitoring on Balena devices

init_config:

instances:
  ## Docker daemon configuration
  ## On Balena, we use the DOCKER_HOST environment variable to connect to Docker
  - url: "unix://var/run/balena-engine.sock"

    ## Collect container metrics (CPU, memory, network, I/O)
    collect_container_size: true
    collect_container_count: true
    collect_volume_count: true
    collect_images_stats: true
    collect_image_size: true
    collect_disk_stats: true
    collect_exit_codes: true

    ## Performance settings
    ## Collect metrics every 15 seconds (default)
    min_collection_interval: 15

    ## Container filtering
    ## Exclude the datadog-agent itself from monitoring
    exclude:
      - "name:datadog-agent"
      - "name:dd-agent"

    ## Event collection
    ## Collect Docker events (start, stop, die, etc.)
    collect_events: true
    filtered_event_types:
      - "top"
      - "exec_create"
      - "exec_start"

    ## Tags
    ## Add custom tags to all Docker metrics
    tags:
      - "env:production"
      - "platform:balena"
      - "device:balena-home"

    ## Container labels as tags
    ## Extract Docker labels and add them as Datadog tags
    docker_labels_as_tags:
      com.datadoghq.tags.service: service
      com.datadoghq.tags.env: env
      io.balena.service.name: balena_service

    ## Performance options
    ## Use fewer API calls to reduce overhead
    use_latest_api_version: true

## Logs Configuration
## Note: Log collection is configured via environment variables in docker-compose.yml:
## - DD_LOGS_ENABLED=true
## - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
## - DD_CONTAINER_EXCLUDE="name:datadog-agent"
##
## Container-specific log configuration uses Docker labels:
## labels:
##   com.datadoghq.ad.logs: '[{"source": "app-name", "service": "app-name"}]'
##   com.datadoghq.ad.tags: '["env:production"]'
